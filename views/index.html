<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Tickets Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .header-actions {
            margin-bottom: 30px;
        }

        .btn-add-ticket {
            background-color: #1e90ff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-add-ticket:hover {
            background-color: #1873cc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background-color: #f8f9fa;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status-open {
            background-color: #fef3cd;
            color: #856404;
        }

        .status-in_progress {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-resolved {
            background-color: #d4edda;
            color: #155724;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-view-messages {
            background-color: #28a745;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-view-messages:hover {
            background-color: #218838;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Support Tickets Dashboard</h1>
        
        <div class="header-actions">
            <button class="btn-add-ticket" onclick="addTicket()">Add A Ticket</button>
        </div>

        <div id="error-message"></div>
        <div id="tickets-container">
            <div class="loading">Loading tickets...</div>
        </div>
    </div>

    <script>
        // Load tickets on page load
        window.addEventListener('DOMContentLoaded', loadTickets);

        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets');
                if (!response.ok) {
                    throw new Error('Failed to load tickets');
                }
                
                const tickets = await response.json();
                displayTickets(tickets);
            } catch (error) {
                showError('Error loading tickets: ' + error.message);
            }
        }

        function displayTickets(tickets) {
            const container = document.getElementById('tickets-container');
            
            if (!tickets || tickets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>No tickets found</p>
                        <p>Click "Add A Ticket" to create your first support ticket</p>
                    </div>
                `;
                return;
            }

            const tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Created By</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tickets.map(ticket => `
                            <tr>
                                <td>#${ticket.ticket_id}</td>
                                <td>${escapeHtml(ticket.title)}</td>
                                <td><span class="status-badge status-${ticket.status}">${ticket.status.replace('_', ' ')}</span></td>
                                <td>${escapeHtml(ticket.created_by)}</td>
                                <td>${formatDate(ticket.created_at)}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-delete" onclick="deleteTicket(${ticket.ticket_id})" 
                                                title="Deleting this ticket will also delete all its messages">
                                            Delete
                                        </button>
                                        <button class="btn-view-messages" onclick="viewMessages(${ticket.ticket_id})">
                                            View Messages
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHtml;
        }

        function addTicket() {
            // Redirect to add ticket page or open modal
            window.location.href = '/add-ticket';
        }

        async function deleteTicket(ticketId) {
            const confirmed = confirm(
                'Are you sure you want to delete this ticket?\n\n' +
                'Warning: This will also delete all messages associated with this ticket. ' +
                'This action cannot be undone.'
            );
            
            if (!confirmed) return;

            try {
                const response = await fetch(`/api/tickets/${ticketId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete ticket');
                }
                
                // Reload tickets
                await loadTickets();
                showSuccess('Ticket deleted successfully');
            } catch (error) {
                showError('Error deleting ticket: ' + error.message);
            }
        }

        function viewMessages(ticketId) {
            // Redirect to messages page
            window.location.href = `/tickets/${ticketId}/messages`;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
            setTimeout(() => errorDiv.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `<div style="background-color: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin-bottom: 20px;">${escapeHtml(message)}</div>`;
            setTimeout(() => errorDiv.innerHTML = '', 3000);
        }
    </script>
</body>
</html>
