<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Ticket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .btn-edit {
            background-color: #1e90ff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .btn-edit:hover {
            background-color: #1873cc;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }

        /* Ticket Details Grid */
        .ticket-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-value {
            font-size: 16px;
            color: #333;
            padding: 10px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }

        .field-value.full-width {
            grid-column: 1 / -1;
        }

        /* Status Selector */
        .status-selector {
            display: flex;
            gap: 10px;
            padding: 10px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }

        .status-option {
            flex: 1;
            padding: 8px 16px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .status-option:hover {
            border-color: #1e90ff;
        }

        .status-option.active {
            border-color: #1e90ff;
            background-color: #e7f3ff;
            color: #1e90ff;
        }

        .status-option.open {
            color: #856404;
        }

        .status-option.open.active {
            background-color: #fef3cd;
            border-color: #856404;
            color: #856404;
        }

        .status-option.in_progress {
            color: #0c5460;
        }

        .status-option.in_progress.active {
            background-color: #d1ecf1;
            border-color: #0c5460;
            color: #0c5460;
        }

        .status-option.resolved {
            color: #155724;
        }

        .status-option.resolved.active {
            background-color: #d4edda;
            border-color: #155724;
            color: #155724;
        }

        /* Timeline Section */
        .timeline-section {
            margin-top: 40px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .timeline-header h2 {
            color: #333;
            font-size: 22px;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #dee2e6;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 30px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -34px;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #1e90ff;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #dee2e6;
        }

        .timeline-content {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #1e90ff;
        }

        .timeline-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #6c757d;
        }

        .timeline-change {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }

        .timeline-change strong {
            color: #1e90ff;
        }

        .timeline-user {
            font-weight: 600;
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .ticket-details {
                grid-template-columns: 1fr;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: white;
            margin: 40px auto;
            padding: 30px;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 24px;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #6c757d;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .modal-close:hover {
            background-color: #f8f9fa;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-label.required::after {
            content: ' *';
            color: #dc3545;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #1e90ff;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }

        .form-input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .form-select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #1e90ff;
            box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #1e90ff;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #1873cc;
        }

        .btn-primary:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .info-text {
            font-size: 13px;
            color: #6c757d;
            margin-top: 5px;
        }

        .readonly-field {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-back">← Back to Dashboard</a>
        
        <div class="header">
            <h1>Ticket Details</h1>
            <a href="#" class="btn-edit" id="edit-button" onclick="openEditForm(event)">Edit Ticket Details</a>
        </div>

        <div id="message-container"></div>

        <!-- Ticket Details Grid -->
        <div id="ticket-details-container">
            <div class="loading">Loading ticket details...</div>
        </div>

        <!-- Timeline Section -->
        <div class="timeline-section">
            <div class="timeline-header">
                <h2>Ticket History Timeline</h2>
            </div>
            <div id="timeline-container">
                <div class="loading">Loading timeline...</div>
            </div>
        </div>
    </div>

    <script>
        let currentTicket = null;
        let ticketId = null;

        // Extract ticket ID from URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            ticketId = urlParams.get('id');
            
            if (!ticketId) {
                showError('No ticket ID provided');
                return;
            }
            
            loadTicketDetails();
            loadTimeline();
        });

        async function loadTicketDetails() {
            try {
                const response = await fetch(`/api/tickets/${ticketId}`);
                if (!response.ok) {
                    throw new Error('Failed to load ticket details');
                }
                
                currentTicket = await response.json();
                displayTicketDetails(currentTicket);
            } catch (error) {
                showError('Error loading ticket: ' + error.message);
            }
        }

        function displayTicketDetails(ticket) {
            const container = document.getElementById('ticket-details-container');
            
            container.innerHTML = `
                <div class="ticket-details">
                    <div class="field-group">
                        <div class="field-label">Ticket ID</div>
                        <div class="field-value">#${ticket.ticket_id}</div>
                    </div>
                    
                    <div class="field-group">
                        <div class="field-label">Created By</div>
                        <div class="field-value">${escapeHtml(ticket.created_by)}</div>
                    </div>
                    
                    <div class="field-group">
                        <div class="field-label">Created At</div>
                        <div class="field-value">${formatDate(ticket.created_at)}</div>
                    </div>
                    
                    <div class="field-group">
                        <div class="field-label">Last Updated</div>
                        <div class="field-value">${formatDate(ticket.updated_at || ticket.created_at)}</div>
                    </div>
                    
                    <div class="field-group" style="grid-column: 1 / -1;">
                        <div class="field-label">Title</div>
                        <div class="field-value">${escapeHtml(ticket.title)}</div>
                    </div>
                    
                    <div class="field-group" style="grid-column: 1 / -1;">
                        <div class="field-label">Status</div>
                        <div class="status-selector">
                            <div class="status-option open ${ticket.status === 'open' ? 'active' : ''}" 
                                 onclick="updateStatus('open')">
                                Open
                            </div>
                            <div class="status-option in_progress ${ticket.status === 'in_progress' ? 'active' : ''}" 
                                 onclick="updateStatus('in_progress')">
                                In Progress
                            </div>
                            <div class="status-option resolved ${ticket.status === 'resolved' ? 'active' : ''}" 
                                 onclick="updateStatus('resolved')">
                                Resolved
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function updateStatus(newStatus) {
            if (currentTicket.status === newStatus) return;
            
            try {
                const response = await fetch(`/api/tickets/${ticketId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to update status');
                }
                
                currentTicket.status = newStatus;
                displayTicketDetails(currentTicket);
                loadTimeline(); // Refresh timeline
                showSuccess('Status updated successfully');
            } catch (error) {
                showError('Error updating status: ' + error.message);
            }
        }

        async function loadTimeline() {
            try {
                const response = await fetch(`/api/tickets/${ticketId}/history`);
                if (!response.ok) {
                    throw new Error('Failed to load timeline');
                }
                
                const history = await response.json();
                displayTimeline(history);
            } catch (error) {
                document.getElementById('timeline-container').innerHTML = 
                    '<p style="color: #666; text-align: center;">No history available</p>';
            }
        }

        function displayTimeline(history) {
            const container = document.getElementById('timeline-container');
            
            if (!history || history.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center;">No changes recorded yet</p>';
                return;
            }

            const timelineHtml = `
                <div class="timeline">
                    ${history.map(item => `
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="timeline-meta">
                                    <span class="timeline-user">${escapeHtml(item.changed_by || 'System')}</span>
                                    <span>${formatDate(item.changed_at)}</span>
                                </div>
                                <div class="timeline-change">
                                    ${getChangeDescription(item)}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = timelineHtml;
        }

        function getChangeDescription(item) {
            switch(item.change_type) {
                case 'status_change':
                    return `Status changed from <strong>${item.old_value}</strong> to <strong>${item.new_value}</strong>`;
                case 'title_change':
                    return `Title updated to <strong>${escapeHtml(item.new_value)}</strong>`;
                case 'created':
                    return `Ticket created`;
                default:
                    return `${item.field_name} updated`;
            }
        }

        function openEditForm(event) {
            event.preventDefault();
            window.location.href = `/editticketdetails?id=${ticketId}`;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="success">${escapeHtml(message)}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }
    </script>
</body>
</html>
