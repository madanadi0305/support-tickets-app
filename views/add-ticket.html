<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Ticket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3) !important;
            transform: translateX(-2px);
        }

        h1 {
            color: #ffffff !important;
            font-size: 24px;
            font-weight: 700;
            margin: 0 !important;
            letter-spacing: -0.5px;
        }

        .form-container {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .form-label.required::after {
            content: ' *';
            color: #dc3545;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background-color: #ffffff;
        }

        .form-select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background-color: #ffffff;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #e2e8f0;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3) !important;
        }

        .btn-primary:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4) !important;
        }

        .btn-primary:active {
            transform: translateY(0) !important;
        }

        .btn-primary:disabled {
            background: #94a3b8 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background-color: #e2e8f0 !important;
            color: #475569 !important;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1 !important;
        }

        .error {
            background-color: #fee;
            color: #c33;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
            font-weight: 500;
        }

        .success {
            background-color: #d1fae5;
            color: #065f46;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #10b981;
            font-weight: 500;
        }

        .info-text {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                margin: 20px;
                max-width: calc(100% - 40px);
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            .form-container {
                padding: 24px 20px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Add New Ticket</h1>
            <a href="/" class="btn-back">← Back to Dashboard</a>
        </div>

        <div class="form-container">
            <div id="message-container"></div>

            <form id="add-ticket-form" onsubmit="submitForm(event)">
            <div class="form-group">
                <label class="form-label required" for="title">Ticket Title</label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    class="form-input" 
                    placeholder="Enter a descriptive title for your ticket"
                    required
                    maxlength="200"
                >
                <p class="info-text">Maximum 200 characters</p>
            </div>

            <div class="form-group">
                <label class="form-label required" for="status">Status</label>
                <select id="status" name="status" class="form-select" required>
                    <option value="open" selected>Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label required" for="created_by">Your Email</label>
                <input 
                    type="email" 
                    id="created_by" 
                    name="created_by" 
                    class="form-input" 
                    placeholder="your.email@example.com"
                    required
                    maxlength="100"
                >
                <p class="info-text">This will be used to identify you as the ticket creator</p>
            </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="goBack()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submit-btn">Create Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function submitForm(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            const formData = {
                title: document.getElementById('title').value,
                status: document.getElementById('status').value,
                created_by: document.getElementById('created_by').value
            };

            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to create ticket');
                }
                
                const newTicket = await response.json();
                showSuccess('Ticket created successfully! Redirecting...');
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } catch (error) {
                showError('Error creating ticket: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Ticket';
            }
        }

        function goBack() {
            window.location.href = '/';
        }

        function showError(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        function showSuccess(message) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="success">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
